name: Build Android offline host
on:
  pull_request:
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "package*.json"
      - "vite.config.*"
      - "scripts/finalize-build.mjs"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018
      - run: npm ci
      - run: npm run build
      - run: node android/prepare.mjs
      - run: node --test android/host.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: node android/browser-check.mjs
      - run: ./android/gradlew -p android :app:assembleDebug
      - run: '"${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: crapsTV-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
